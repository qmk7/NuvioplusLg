name: Build Nuvio Plus LG

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli

      - name: Build IPK
        run: |
          mkdir -p output
          ares-package -o output .

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: NuvioPlusLG-IPK
          path: output/*.ipk
